<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> Forms</h1>
    <div>
        <form action="atag.html " target="_blank">
           
            <fieldset>
                <legend> <h3>Enter your basic information </h3></legend>

            <label for="fullName">Full name :</label>
          <input type="text" id="fullName" placeholder="Enter Your Name" required>

          <br><br>
           <label for="email">Email :</label>
          <input type="email" id="email" placeholder="Enter your Email" required>

          <br><br>|
           <label for="password">Password:</label>
          <input type="password" id="password" placeholder="Enter your Password" required>
          
          <br><br>
           <label for="checkbox">Are you 18 + ?</label>
          <input type="checkbox" id="checkbox" >
         
          <br><br>
           <label for="phonenumber">Enter your phone Number: </label>
          <input type="number" id="phonenumber"required min="0" >
       
          <br><br>
           <label for="gender">Gender : </label>
           <label for="male">Male </label>
          <input type="radio" id="male" name="gender" >
            <label for="female">Female </label>
          <input type="radio" id="female" name="gender" >

           <br><br>
           <label for="date">Enter your DOB</label>
          <input type="date" id="date" >
       
           <br><br>
           <label for="file">Enter your PHOTO</label>
          <input type="file" id="file" >

          <BR></BR>
          <label for="city">Select your City</label>
           <select name="city" id="city">
            <option value="delhi">Delhi</option>
           <option value="mumbai">Mumbai</option>
           <option value="kolkata">Kolkata</option>
           <option value="noida">Noida</option>
           <option value="ghaziabad" selected>Ghaziabad</option>
        
           </select>


           
          
          <br><br>
          <button type="submit"> SUBMIT FORM</button>

          </fieldset>
        </form>
    

    </div>
</body>     
</html>
